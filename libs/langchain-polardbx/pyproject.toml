[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-polardbx"
version = "0.3.1"
description = "An integration package connecting PolarDB-X and LangChain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "PolarDB-X Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "mysql-connector-python>=8.0.0",
]

[project.optional-dependencies]
async = [
    "aiomysql>=0.2.0",
]
mmr = [
    "numpy>=1.24.0",
]
sql = [
    "langchain-community>=0.0.20",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
]

[project.entry-points."sqlalchemy.dialects"]
polardbx = "langchain_polardbx.sql:PolarDBXDialect"

[project.urls]
Homepage = "https://github.com/polardb/langchain-polardbx"
Repository = "https://github.com/polardb/langchain-polardbx"
Issues = "https://github.com/polardb/langchain-polardbx/issues"

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-socket>=0.7.0",
    "numpy>=1.24.0",
    "langchain-tests>=0.3.5",
    "langchain-community>=0.0.20",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
]
test_integration = [
    "aiomysql>=0.2.0",
]
lint = [
    "ruff>=0.1.8",
]
typing = [
    "mypy>=1.7.1",
]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_polardbx"]

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "T201", # print
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF001", "E501"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
